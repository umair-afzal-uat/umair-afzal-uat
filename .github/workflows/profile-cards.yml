name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Asia/Karachi
          NAME: Muhammad Umair Afzal
          THEME: github_dark
          AUTO_PUSH: false

      # Recolor the github_dark cards to the umairafzal.pro palette
      - name: Apply portfolio colors
        run: |
          mkdir -p assets/cards
          for f in 0-profile-details 2-most-commit-language 3-stats; do
            sed -e 's/#0d1117/#121714/Ig' \
                -e 's/#2e343b/#2A332E/Ig' \
                -e 's/#8b949e/#A8B2AC/Ig' \
                -e 's/#77909c/#7DDBB8/Ig' \
                -e 's/#0366d6/#7DDBB8/Ig' \
                -e 's/#40c463/#1FA37A/Ig' \
                "profile-summary-card-output/github_dark/$f.svg" > "assets/cards/$f.svg"
          done
          rm -rf profile-summary-card-output

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
