<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Muhammad Umair Afzal, Senior Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#0e4f8a"/>
      <stop offset="1" stop-color="#5b2bbf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name  { font: 700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.5px; }
    .role  { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#accent); }
    .meta  { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .code  { font: 500 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #ffffff; fill-opacity: 0.55; }
    .orb  { animation: float 7s ease-in-out infinite; }
    .orb2 { animation: float 9s ease-in-out infinite reverse; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .orb, .orb2, .cursor { animation: none; opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle class="orb"  cx="1040" cy="70"  r="120" fill="#38bdf8" fill-opacity="0.16"/>
    <circle class="orb2" cx="900"  cy="230" r="90"  fill="#a78bfa" fill-opacity="0.20"/>

    <g transform="translate(64 0)">
      <text class="meta" x="0" y="70">Hi there, I’m</text>
      <text class="name" x="0" y="128">Muhammad Umair Afzal</text>
      <text class="role" x="0" y="168">Senior Full-Stack &amp; AI Engineer</text>
      <text class="meta" x="0" y="206">10+ years shipping SaaS, CRM, e-signing &amp; AI systems · Remote from Lahore, PK</text>
    </g>

    <g transform="translate(830 92)">
      <rect width="300" height="112" rx="12" fill="#020617" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="36" cy="18" r="5" fill="#fbbf24"/><circle cx="52" cy="18" r="5" fill="#34d399"/>
      <text class="code" x="20" y="52">$ stack --primary</text>
      <text class="code" x="20" y="74" style="fill-opacity:0.9">laravel · node · react · next</text>
      <text class="code" x="20" y="96" style="fill-opacity:0.9">claude · openai · rag<tspan class="cursor"> ▍</tspan></text>
    </g>
  </g>
</svg>
