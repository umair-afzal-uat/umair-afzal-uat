<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Umair Afzal, Senior Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F0D"/>
      <stop offset="0.6" stop-color="#121714"/>
      <stop offset="1" stop-color="#16251E"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F6E56"/>
      <stop offset="1" stop-color="#1FA37A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1FA37A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1FA37A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4F6F3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .name { font: 900 76px "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #F4F6F3; letter-spacing: -1px; }
    .lead { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F4F6F3; }
    .mint { fill: #7DDBB8; }
    .meta { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A8B2AC; }
    .tag  { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #121714; letter-spacing: 1.5px; }
    .code { font: 500 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #A8B2AC; }
    .hi   { fill: #F4F6F3; }
    .glow   { animation: pulse 6s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .glow, .cursor { animation: none; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle class="glow" cx="1010" cy="150" r="260" fill="url(#glow)"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#acc)"/>

  <g transform="translate(64 0)">
    <rect x="0" y="40" width="44" height="44" fill="none" stroke="#F4F6F3" stroke-width="2"/>
    <text x="22" y="69" text-anchor="middle" style="font: 800 17px -apple-system, Helvetica, Arial, sans-serif; fill: #F4F6F3;">UA</text>
    <circle cx="66" cy="62" r="4" fill="#1FA37A"/>
    <text class="meta" x="78" y="68">Lahore, PK · Remote for US &amp; UK teams</text>

    <text class="name" x="0" y="168">Umair Afzal</text>
    <text class="lead" x="0" y="212">I build <tspan class="mint">SaaS, CRM &amp; production AI systems</tspan></text>
    <text class="meta" x="0" y="246">Senior Full-Stack &amp; AI Engineer · 10+ years · Laravel · Node.js · React · Next.js</text>
  </g>

  <g transform="translate(850 92)">
    <rect width="290" height="124" fill="#0B0F0D" fill-opacity="0.85" stroke="#F4F6F3" stroke-opacity="0.12"/>
    <rect width="290" height="28" fill="#F4F6F3" fill-opacity="0.04"/>
    <circle cx="16" cy="14" r="4" fill="#5A645E"/><circle cx="30" cy="14" r="4" fill="#5A645E"/><circle cx="44" cy="14" r="4" fill="#1FA37A"/>
    <text class="code" x="18" y="58"><tspan class="mint">$</tspan> whoami --stack</text>
    <text class="code hi" x="18" y="82">laravel · node · react · next</text>
    <text class="code hi" x="18" y="104">claude · openai · rag<tspan class="cursor mint"> ▍</tspan></text>
  </g>
</svg>
